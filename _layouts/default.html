<html lang="{{ site.lang }}">

<head>
	<title>{{ page.title }}</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="description" content="{{ page.description | default: site.description }}" />
	<meta name="author" content="{{ site.author }}" />
	{%- if page.noindex %}
	<meta name="robots" content="noindex" />
	{%- else %}
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="{{ site.title }}" />
	<meta property="og:title" content="{{ page.title }}" />
	<meta property="og:description" content="{{ page.description | default: site.description }}" />
	<meta property="og:url" content="{{ page.url | absolute_url }}" />
	<meta property="og:image" content="{{ site.og_image | absolute_url }}" />
	<meta name="twitter:card" content="summary" />
	<link rel="canonical" href="{{ page.url | absolute_url }}" />
	{%- endif %}
	<link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml" />
	<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
	<noscript>
		<link rel="stylesheet" href="{{ '/assets/css/noscript.css' | relative_url }}" />
	</noscript>
</head>

<body class="is-preload">

	<!-- Wrapper -->
	<div id="wrapper"{% if page.intro %} class="fade-in"{% endif %}>
{% if page.intro %}
		<!-- Intro -->
{% include intro.html %}
{% endif %}
		<!-- Header -->
		<header id="header">
			<a href="{{ '/' | relative_url }}" class="logo">{{ page.quote }}</a>
		</header>

		<!-- Nav -->
{% include nav.html %}

		<!-- Main -->
		<div id="main">
{{ content }}
			<!-- Footer -->
{% include footer.html %}

		</div>

		<!-- Copyright -->
{% include copyright.html %}

	</div>

	<!-- Scripts -->
	<script src="{{ '/assets/js/jquery.min.js' | relative_url }}"></script>
	<script src="{{ '/assets/js/jquery.scrollex.min.js' | relative_url }}"></script>
	<script src="{{ '/assets/js/jquery.scrolly.min.js' | relative_url }}"></script>
	<script src="{{ '/assets/js/browser.min.js' | relative_url }}"></script>
	<script src="{{ '/assets/js/breakpoints.min.js' | relative_url }}"></script>
	<script src="{{ '/assets/js/util.js' | relative_url }}"></script>
	<script src="{{ '/assets/js/main.js' | relative_url }}"></script>

</body>

</html>
