    url: /#about
  - title: Experience
    url: /#experience
  - title: Education
    url: /#education
  - title: Teaching & Outreach
    url: /#teaching
  - title: Publications
    url: /#publications

# The buttons in the footer.
social:
  - name: LinkedIn
    url: https://www.linkedin.com/in/pietropaolo-frisoni-757b3b217/
  - name: GitHub
    url: https://github.com/PietropaoloFrisoni
  - name: INSPIRE-HEP
    url: https://inspirehep.net/authors/2122225

# The quote in the bar at the very bottom of every page.
footer_quote: What we know is a drop, what we don't know is an ocean
footer_quote_author: Isaac Newton

exclude:
  - README.md
  - .claude
  - .prettierignore
